<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>抖音文章发布器</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand"><span class="brand-mark"></span><span>抖音文章发布器</span></div>
      <div id="connection-state" class="connection-state">正在检查 S3 配置</div>
    </header>
    <main>
      <section class="account-panel" aria-label="账号登录">
        <div>
          <p class="eyebrow">当前 Windows 用户</p>
          <h1>使用自己的抖音账号发布</h1>
          <p id="account-copy" class="muted">首次使用请完成抖音登录。</p>
        </div>
        <div class="account-actions">
          <button id="login-button" class="secondary" type="button">登录抖音</button>
          <button id="finish-login-button" class="quiet" type="button">我已完成登录</button>
        </div>
      </section>

      <form id="article-form" class="editor" novalidate>
        <div class="field-grid">
          <label>文章标题<input id="title" name="title" maxlength="30" required autocomplete="off" /></label>
          <label>文章摘要<input id="summary" name="summary" maxlength="30" required autocomplete="off" /></label>
        </div>
        <div class="field-grid compact">
          <label>文章话题<input id="topic-tag" name="topicTag" value="暗区突围" maxlength="20" required autocomplete="off" /></label>
          <div class="image-field"><span>文章头图</span><div class="image-control"><button id="image-button" class="secondary" type="button">选择图片</button><span id="image-name">尚未选择</span></div></div>
        </div>
        <label>正文<textarea id="content" name="content" rows="13" required></textarea></label>
        <div class="form-footer"><p id="progress" aria-live="polite">准备就绪</p><button id="publish-button" class="primary" type="submit">发布文章</button></div>
      </form>

    </main>
    <script type="module" src="renderer.mjs"></script>
  </body>
</html>
