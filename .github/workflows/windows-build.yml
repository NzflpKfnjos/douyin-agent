name: Build Windows publisher

on:
  workflow_dispatch:
  push:
    paths:
      - "windows-publisher/desktop/**"
      - ".github/workflows/windows-build.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows-publisher/desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows-publisher/desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build NSIS installer
        run: npm run dist:win

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: douyin-article-publisher-windows-${{ github.run_number }}
          path: windows-publisher/desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 14
